
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trainingplan-sql

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "127.0.0.1:14333:1433"

    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s



